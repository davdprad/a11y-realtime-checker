<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teste dinâmico — Apêndice B</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #1b1b1b;
        background: #fff;
        margin: 24px;
      }
      .card {
        border: 1px solid #555;
        padding: 16px;
        margin: 16px 0;
        max-width: 640px;
      }
      .card p {
        color: #333;
      }
      body.tema-claro .card p {
        color: #b0b0b0;
      }
      button {
        min-width: 32px;
        min-height: 32px;
        padding: 4px 12px;
        font: inherit;
      }
      .modal {
        position: fixed;
        inset: 20% 30%;
        background: #fff;
        border: 2px solid #000;
        padding: 16px;
      }
      .close {
        width: 32px;
        height: 32px;
        padding: 0;
      }
      img {
        display: block;
      }
      .icon-link {
        display: inline-block;
        width: 32px;
        height: 32px;
      }
      label,
      input {
        display: block;
        margin: 4px 0;
      }
      input {
        min-height: 32px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Loja de exemplo</h1>
      <nav aria-label="Principal">
        <a href="#produtos">Produtos</a>
      </nav>
    </header>
    <main>
      <section class="card" id="produtos">
        <h2>Produtos</h2>
        <p id="texto-card">Texto do cartão com bom contraste.</p>
        <div id="area-imagem"></div>
        <div id="area-link"></div>
      </section>
      <section class="card">
        <h2>Newsletter</h2>
        <form id="form" onsubmit="return false;">
          <div id="campo">
            <label for="email" id="rotulo-email">E-mail</label>
            <input id="email" type="email" autocomplete="email" />
          </div>
          <button type="submit">Assinar</button>
        </form>
      </section>
    </main>
    <script>
      /**
       * Roteiro do Apêndice B: cada evento emite `a11y-rt:mutate` (detail em
       * string JSON) imediatamente antes de alterar o DOM, sem recarregar.
       */
      (function () {
        function emit(eventId, expected, kind) {
          const detail = JSON.stringify({
            eventId: eventId,
            t: performance.now(),
            expected: expected,
            kind: kind,
          });
          document.dispatchEvent(new CustomEvent('a11y-rt:mutate', { detail: detail }));
        }
        const svgIcon =
          '<svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16"><path d="M2 2 L14 14 M14 2 L2 14" stroke="black"/></svg>';
        const run = {
          // E1: abrir um modal com botão de fechar sem nome acessível (4.1.2)
          E1() {
            emit('E1', '4.1.2', 'flag');
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.id = 'modal';
            modal.setAttribute('role', 'dialog');
            modal.setAttribute('aria-label', 'Promoção');
            modal.innerHTML =
              '<p>Frete grátis hoje!</p><button type="button" class="close" id="fechar">' +
              svgIcon +
              '</button>';
            document.body.append(modal);
          },
          // E2: trocar o tema, reduzindo o contraste de um texto (1.4.3)
          E2() {
            emit('E2', '1.4.3', 'flag');
            document.body.classList.add('tema-claro');
          },
          // E3: inserir uma imagem informativa sem texto alternativo (1.1.1)
          E3() {
            emit('E3', '1.1.1', 'flag');
            const img = document.createElement('img');
            img.id = 'grafico';
            img.width = 120;
            img.height = 60;
            img.src =
              'data:image/svg+xml,' +
              encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60"><rect width="120" height="60" fill="#0b57d0"/></svg>',
              );
            document.getElementById('area-imagem').append(img);
          },
          // E4: inserir um link sem texto (2.4.4)
          E4() {
            emit('E4', '2.4.4', 'flag');
            const a = document.createElement('a');
            a.href = '#carrinho';
            a.id = 'link-carrinho';
            a.className = 'icon-link';
            a.innerHTML = svgIcon;
            document.getElementById('area-link').append(a);
          },
          // E5: remover o rótulo de um campo de formulário (1.3.1)
          E5() {
            emit('E5', '1.3.1', 'flag');
            document.getElementById('rotulo-email').remove();
          },
        };
        const fix = {
          E1() {
            emit('F1', '4.1.2', 'fix');
            document.getElementById('fechar').setAttribute('aria-label', 'Fechar');
          },
          E2() {
            emit('F2', '1.4.3', 'fix');
            document.body.classList.remove('tema-claro');
          },
          E3() {
            emit('F3', '1.1.1', 'fix');
            document.getElementById('grafico').alt = 'Vendas em alta';
          },
          E4() {
            emit('F4', '2.4.4', 'fix');
            document
              .getElementById('link-carrinho')
              .setAttribute('aria-label', 'Carrinho');
          },
          E5() {
            emit('F5', '1.3.1', 'fix');
            const label = document.createElement('label');
            label.htmlFor = 'email';
            label.id = 'rotulo-email';
            label.textContent = 'E-mail';
            document.getElementById('campo').prepend(label);
          },
        };
        window.a11yRtDynamic = { run: (id) => run[id](), fix: (id) => fix[id]() };
      })();
    </script>
  </body>
</html>
